name: Scala CI

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Scala CLI
        uses: VirtusLab/scala-cli-setup@v1

      - name: Compile
        run: scala-cli compile .
